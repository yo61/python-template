repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      # Whitespace / line endings
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      # File integrity
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      # Executables / shebangs
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      # Parseable config
      - id: check-yaml
      - id: check-toml
      - id: check-json

  # ruff, ty and pytest run via `uv run` so their versions are single-sourced
  # from uv.lock — the same binaries CI runs. No second `rev:` to keep aligned.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
        pass_filenames: false
      - id: ty
        name: ty type check
        entry: uv run --no-sync ty check src
        language: system
        types: [python]
        pass_filenames: false
      # pytest is a pre-push gate rather than per-commit, so a docs-only
      # commit is not held up. CI is the authoritative gate.
      - id: pytest
        name: pytest
        entry: uv run --no-sync pytest -q
        language: system
        stages: [pre-push]
        types: [python]
        pass_filenames: false

  # The template ships bootstrap, so shell is linted and formatted. Flags match
  # CI and ~/.vimrc's ALE config: -i 2 -bn -ci -sr. Note `-i2` is invalid --
  # Go's flag parser reads it as a flag named `i2` and shfmt exits non-zero.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: 99470f5e12208ff0fb17ab81c3c494f7620a1d8d  # frozen: v0.11.0
    hooks:
      - id: shellcheck
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9  # frozen: v3.14.1-1
    hooks:
      - id: shfmt
        args: [-i, "2", -bn, -ci, -sr, -d]

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: 1f1ac45c93d1c2ce36b71330252c489a5f4f2724  # frozen: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          # Exact: Renovate's regex manager in renovate.json5 moves it; Dependabot moves rev.
          - "@commitlint/config-conventional@21.2.3"

  # The maintained fork: upstream rhysd/actionlint stopped at 1.7.12, which rejects the
  # ubuntu-26.04 runner label.
  - repo: https://github.com/kjanat/actionlint
    rev: 08bb2c4f0d039744455b87aef1c647fb8b66d37b  # frozen: v1.17.0
    hooks:
      - id: actionlint

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
