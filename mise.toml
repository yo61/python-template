[tools]
uv = "0.12"
# Exact, matching CI's TASK_VERSION, NODE_VERSION and PNPM_VERSION; Renovate moves each pair
# together. uv is a range on purpose: see required-version in pyproject.toml.
task = "3.54.0"
node = "22.23.3"
pnpm = "11.28.3"

[env]
# Stop ad-hoc `uv run` from rewriting uv.lock as a side effect. The lockfile
# changes deliberately: `task uv:lock` locally, or the release-please
# sync-lockfile job in CI.
#
# This value also disables the commands you would reach for to work around it.
# `uv lock` becomes a no-op that exits 0, and `uv lock --check` degrades to a
# warning that still exits 0 -- so neither reports drift. `uv sync --locked`,
# which CI runs, is a hard error here. CI never loads mise, so it sees none of
# this. `task uv:lock` lifts UV_FROZEN for exactly one command; use it rather
# than fighting the variable.
UV_FROZEN = "1"
_.python.venv = ".venv"
